<html>
<head>
    <title>iisnode logs</title>
    <style type="text/css">
        body
        {
            font-family: "Trebuchet MS" , Arial, Helvetica, sans-serif;
        }
        table
        {
            border-collapse: collapse;
        }
        td, th
        {
            border: 1px solid lightgray;
            padding: 3px 7px 2px 7px;
        }
        th
        {
            text-align: left;
            padding-top: 5px;
            padding-bottom: 4px;
            background-color: Gray;
            color: #ffffff;
        }
        td.stderr
        {
            color: Red;
        }
    </style>
</head>
<body>
    <table id="logFilesTable">
        <tr>
            <th>
                Computer name
            </th>
            <th>
                PID
            </th>
            <th>
                Type
            </th>
            <th>
                Created
            </th>
            <th>
                Link
            </th>
        </tr>
    </table>
    <p id="lastUpdated"></p>
    <script type="text/javascript">

        // this is replaced with actual data at runtime by code in interceptor.js
        var logFiles = [{"file":"10_0_4_6-2012-stderr-1687773637236.txt","computername":"10_0_4_6","pid":2012,"type":"stderr","created":1687773637236},{"file":"10_0_4_6-2012-stdout-1687773637235.txt","computername":"10_0_4_6","pid":2012,"type":"stdout","created":1687773637235},{"file":"10_0_4_6-4128-stderr-1687774020683.txt","computername":"10_0_4_6","pid":4128,"type":"stderr","created":1687774020683},{"file":"10_0_4_6-4128-stdout-1687774020681.txt","computername":"10_0_4_6","pid":4128,"type":"stdout","created":1687774020681},{"file":"10_0_4_6-6008-stderr-1687773511349.txt","computername":"10_0_4_6","pid":6008,"type":"stderr","created":1687773511349},{"file":"10_0_4_6-6008-stdout-1687773511348.txt","computername":"10_0_4_6","pid":6008,"type":"stdout","created":1687773511348},{"file":"10_0_4_6-936-stderr-1687774237909.txt","computername":"10_0_4_6","pid":936,"type":"stderr","created":1687774237909},{"file":"10_0_4_6-936-stdout-1687774237907.txt","computername":"10_0_4_6","pid":936,"type":"stdout","created":1687774237907}];
        var lastUpdated = 1687774238234;
        var date = new Date();

        date.setTime(lastUpdated);
        document.getElementById('lastUpdated').innerHTML = 'Index was last updated ' + date;

        logFiles.sort(function (a, b) {
            return b.created - a.created;
        });

        var logFilesTable = document.getElementById("logFilesTable");
        for (var i = 0; i < logFiles.length; i++) {
            var logFile = logFiles[i];
            date.setTime(logFile.created);
            var row = logFilesTable.insertRow(-1);
            var computerNameCell = row.insertCell(0);
            var pidCell = row.insertCell(1);
            var typeCell = row.insertCell(2);
            var dateCell = row.insertCell(3);
            var logCell = row.insertCell(4);
            computerNameCell.innerHTML = logFile.computername;
            pidCell.innerHTML = logFile.pid.toString();
            typeCell.innerHTML = logFile.type;
            typeCell.setAttribute('class', logFile.type);
            dateCell.innerHTML = date.toString();
            logCell.innerHTML = '<a href="' + logFile.file + '">log</a>';
        };

    </script>
</body>
</html>
